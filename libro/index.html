    <!-- Brand intro: decided before first paint, so it never flashes when skipped. -->
    <script>
      (function () {
        var seen = false;
        try { seen = sessionStorage.getItem("ed-intro-seen") === "1"; } catch (e) {}
        if (/[?&]intro=0(&|$)/.test(location.search)) seen = true;
        if (/[?&]intro=(1|debug)(&|$)/.test(location.search)) seen = false;
        document.documentElement.classList.add(seen ? "no-intro" : "intro-active");
      })();
    </script>
    <style>
      /* Critical intro styles, inline so the logo draws on the very first paint. */
      @property --sweep { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
      .intro { display: none; }
      .intro-active .intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; }
      .intro-veil { position: absolute; inset: 0; background: #0b0907; }
      .intro.is-opening .intro-veil {
        -webkit-mask: radial-gradient(circle var(--hr, 0px) at var(--hx, 50%) var(--hy, 50%), transparent calc(100% - 1.5px), #000 100%);
        mask: radial-gradient(circle var(--hr, 0px) at var(--hx, 50%) var(--hy, 50%), transparent calc(100% - 1.5px), #000 100%);
      }
      .intro-logo { position: relative; width: min(78vw, 23rem); aspect-ratio: 1042 / 278; margin-top: -9vh; }
      .intro-logo svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      /* 1. the ring of the C is drawn from the cut of the C, round, back to it */
      .intro-active .intro-ring {
        -webkit-mask-image: conic-gradient(from 118deg at 13.31% 50%, #000 calc(var(--sweep) - 10deg), transparent var(--sweep));
        mask-image: conic-gradient(from 118deg at 13.31% 50%, #000 calc(var(--sweep) - 10deg), transparent var(--sweep));
        animation: intro-sweep 480ms cubic-bezier(0.33, 0, 0.2, 1) 50ms both;
      }
      /* 2. the word rises letter by letter out of its own baseline */
      .intro-word { clip-path: inset(-20% 0 28.6% 0); }
      .intro-word path { transform-box: fill-box; transform: translateY(112%); animation: intro-rise 360ms cubic-bezier(0.215, 0.61, 0.355, 1) both; animation-delay: calc(110ms + var(--i, 0) * 24ms); }
      .intro-word .intro-accent { opacity: 0; transform: translateY(-80%); animation: intro-accent 260ms cubic-bezier(0.215, 0.61, 0.355, 1) 420ms both; }
      /* 3. AVENUE is uncovered left to right, like light along a sign */
      .intro-avenue { clip-path: inset(-20% 40.2% -20% 0); animation: intro-wipe 360ms cubic-bezier(0.215, 0.61, 0.355, 1) 280ms both; }
      /* the edge of the aperture catches the light, then the light is just the room */
      .intro-rim { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
      .intro-rim circle { fill: none; stroke: #d7ac67; stroke-width: 1.5; opacity: 0; }
      .intro-status { position: absolute; left: 1.5rem; right: 1.5rem; top: calc(50% + 4.5rem); margin: 0; color: rgba(243, 236, 224, 0.62); font: 500 0.82rem/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; opacity: 0; transition: opacity 400ms ease; }
      .intro.is-waiting .intro-status { opacity: 1; }
      .intro-status a { color: #d7ac67; }
      .intro-active .cover-logo, .intro-active .cover-sub, .intro-active .cover-tagline, .intro-active .cover-hint { opacity: 0; }
      @keyframes intro-sweep { from { --sweep: 0deg; } to { --sweep: 372deg; } }
      @keyframes intro-rise { to { transform: none; } }
      @keyframes intro-accent { to { opacity: 1; transform: none; } }
      @keyframes intro-wipe { to { clip-path: inset(-20% 0 -20% 0); } }
      @media (prefers-reduced-motion: reduce) {
        .intro-active .intro * { animation: none !important; }
        .intro-active .intro-ring { -webkit-mask-image: none; mask-image: none; }
        .intro-word, .intro-avenue { clip-path: none; }
        .intro-word path, .intro-word .intro-accent { opacity: 1; transform: none; }
      }
    </style>
