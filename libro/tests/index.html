<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Libro · pruebas</title>
    <style>
      body { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 24px; padding: 16px; background: #f4f2ee; color: #1d1a17; font: 14px/1.45 system-ui, sans-serif; }
      iframe { border: 1px solid #ccc; background: #000; }
      h1 { margin: 0 0 8px; font-size: 18px; }
      #summary { margin: 0 0 12px; font-weight: 600; }
      ol { margin: 0; padding-left: 20px; }
      li { margin: 2px 0; }
      .pass::marker { content: "✓  "; color: #2a7a3b; }
      .fail::marker { content: "✗  "; color: #b3261e; }
      .fail { color: #b3261e; }
      small { color: #6b645c; }
    </style>
  </head>
  <body>
    <iframe id="frame" width="390" height="844" title="Libro bajo prueba"></iframe>
    <main>
      <h1>Libro · pruebas de riesgo</h1>
      <p id="summary">Ejecutando…</p>
      <ol id="results"></ol>
      <p><small>Gestos simulados con Pointer Events dentro del iframe. Abre esta página en el navegador o el móvil que quieras comprobar.</small></p>
    </main>
    <script type="module" src="runner.js"></script>
  </body>
</html>
